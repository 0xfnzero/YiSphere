<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>易道 · 易经·八字·六爻·黄道吉日</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #0f0e14;
      --surface: #1a1922;
      --border: #2d2a38;
      --text: #e8e4f0;
      --text-muted: #9b96a8;
      --accent: #c9a227;
      --accent-dim: #8b7a2a;
      --user-msg: #252330;
      --assistant-msg: #1e1c28;
      --radius: 12px;
      --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
    .app-layout {
      display: flex;
      width: 100vw;
      max-width: none;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .sidebar {
      width: 292px;
      min-width: 292px;
      flex: 0 0 292px;
      background: #17161f;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 1rem 1rem 0.9rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }
    .sidebar-header h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--accent);
    }
    .sidebar-header p {
      margin: 0.25rem 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .master-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.55rem 0.55rem 0.75rem;
    }
    .master-list::-webkit-scrollbar { width: 6px; }
    .master-list::-webkit-scrollbar-track { background: transparent; }
    .master-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .master-group-label {
      padding: 0.65rem 0.45rem 0.45rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .master-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-height: 66px;
      padding: 0.58rem 0.65rem;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 8px;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .master-item:hover {
      background: rgba(255,255,255,0.045);
      border-color: rgba(255,255,255,0.08);
      transform: translateX(1px);
    }
    .master-item.active {
      background: linear-gradient(90deg, rgba(var(--skill-rgb), 0.2), rgba(255,255,255,0.035));
      border-color: rgba(var(--skill-rgb), 0.38);
      box-shadow: inset 3px 0 0 rgb(var(--skill-rgb));
    }
    .master-item .avatar {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background:
        linear-gradient(135deg, var(--avatar-from), var(--avatar-to));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 7px 18px rgba(0,0,0,0.24);
      overflow: hidden;
    }
    .master-item .avatar::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.22), transparent 42%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.09) 0 1px, transparent 1px 8px);
      opacity: 0.55;
    }
    .master-item .avatar::after {
      content: attr(data-mark);
      position: absolute;
      right: 4px;
      bottom: 2px;
      font-size: 0.62rem;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
    }
    .master-item .avatar img,
    .msg-row .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar .avatar-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.03rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.28);
      z-index: 1;
    }
    .master-item .avatar,
    .msg-row .avatar { position: relative; }
    .master-item .info {
      min-width: 0;
      flex: 1;
    }
    .master-item .info .name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .master-item .info .meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }
    .master-item .info .skill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      height: 21px;
      padding: 0 0.45rem;
      border-radius: 6px;
      margin-top: 0.22rem;
      background: rgba(var(--skill-rgb), 0.16);
      border: 1px solid rgba(var(--skill-rgb), 0.23);
      color: rgb(var(--skill-rgb));
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-panel {
      flex: 1 1 auto;
      width: calc(100vw - 292px);
      max-width: none;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .chat-header {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .chat-header .head-text {
      flex: 1;
      min-width: 0;
    }
    .chat-header .name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
    }
    .chat-header .skill {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      line-height: 1.45;
    }
    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-shrink: 0;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
      padding: 0 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.88rem;
    }
    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(201,162,39,0.08);
    }
    .model-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    @supports (scrollbar-color: var(--border) transparent) {
      #messages { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
      .master-list { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
    }
    .msg-row {
      display: flex;
      width: 100%;
      align-items: flex-end;
      gap: 0.5rem;
      justify-content: flex-start;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
    }
    .msg-row.assistant .avatar {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      order: 0;
    }
    .msg-row.user .avatar {
      background: linear-gradient(135deg, #2d4a6f 0%, #1e3a5f 100%);
      order: 1;
    }
    .msg-row .msg-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 72%;
      min-width: 0;
    }
    .msg-row.assistant .msg-block {
      margin-right: auto;
    }
    .msg-row.user .msg-block {
      align-items: flex-end;
      margin-left: auto;
      order: 0;
    }
    .msg-row.user .avatar { order: 1; }
    .msg-row .name {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      padding: 0 0.25rem;
    }
    .msg-row.assistant .name { color: var(--accent); }
    .msg-row.user .name { color: rgba(255,255,255,0.75); }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 18px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    /* 用户消息：右侧，深色气泡 */
    .msg.user {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
      color: #e8ecf0;
      border: none;
      border-bottom-right-radius: 4px;
    }
    /* AI 消息：左侧，灰底气泡 */
    .msg.assistant {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    /* 思考中：左侧气泡 + 动效 */
    .msg.thinking {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      padding: 0.75rem 1rem;
    }
    .msg .msg-body { display: inline; }
    .msg.thinking .think-dots span {
      animation: dot 0.8s ease-in-out infinite;
      opacity: 0.3;
    }
    .msg.thinking .think-dots span:nth-child(2) { animation-delay: 0.15s; }
    .msg.thinking .think-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    #input-area {
      width: 100%;
      padding: 1rem 1.5rem 1.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #input-wrap {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      min-height: 44px;
      max-height: 160px;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      resize: none;
    }
    #input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #send {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send:hover { background: var(--accent-dim); color: var(--text); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      max-width: 960px;
      margin: 0.5rem auto 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(0,0,0,0.62);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .settings-modal {
      width: min(520px, 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .settings-head h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 600;
    }
    .settings-body {
      padding: 1rem 1.25rem 1.25rem;
      display: grid;
      gap: 0.85rem;
    }
    .field {
      display: grid;
      gap: 0.35rem;
    }
    .field label {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .field input {
      width: 100%;
      height: 42px;
      padding: 0 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .toggle-row input {
      margin-top: 0.15rem;
      accent-color: var(--accent);
    }
    .settings-note {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }
    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding-top: 0.25rem;
    }
    .secondary-btn,
    .primary-btn {
      min-height: 40px;
      padding: 0 0.9rem;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    .secondary-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }
    .secondary-btn:hover { border-color: var(--accent); color: var(--accent); }
    .primary-btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }
    .primary-btn:hover { background: var(--accent-dim); color: var(--text); }
    .menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin: -0.25rem 0 0 -0.5rem;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1.25rem;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.08); }
    .menu-btn:active { background: rgba(255,255,255,0.12); }
    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(292px, 86vw);
        min-width: 0;
        flex: 0 0 auto;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        padding-left: env(safe-area-inset-left, 0);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
      .chat-panel { min-width: 0; }
      .chat-panel { width: 100vw; max-width: none; }
      .chat-header {
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        padding-left: calc(1rem + env(safe-area-inset-left, 0));
      }
      .chat-header .head-text { flex: 1; min-width: 0; }
      .chat-header .name { font-size: 1rem; }
      .chat-header .skill { font-size: 0.78rem; margin-top: 0.15rem; }
      .menu-btn { display: flex; }
      .header-actions { margin-left: auto; }
      .model-status { display: none; }
      #messages {
        padding: 0.75rem 1rem 1.5rem;
        max-width: none;
      }
      .msg-row .msg-block { max-width: 85%; }
      .msg-row .avatar { width: 36px; height: 36px; font-size: 0.9rem; }
      .msg { padding: 0.6rem 0.9rem; font-size: 0.95rem; }
      #input-area { padding: 0.75rem 1rem calc(1rem + env(safe-area-inset-bottom, 0)); padding-left: calc(1rem + env(safe-area-inset-left, 0)); padding-right: calc(1rem + env(safe-area-inset-right, 0)); }
      #input-wrap { max-width: none; }
      #input { min-height: 44px; padding: 0.65rem 0.9rem; font-size: 16px; }
      #send { padding: 0.65rem 1rem; min-height: 44px; }
      .hint { max-width: none; font-size: 0.75rem; }
    }
    @media (max-width: 480px) {
      .sidebar { width: min(284px, 90vw); }
      .master-list { padding: 0.45rem; }
      .master-item { min-height: 62px; padding: 0.52rem 0.56rem; }
      .master-item .avatar { width: 42px; height: 42px; }
      .chat-header .skill { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .icon-btn { min-width: 36px; height: 36px; padding: 0 0.65rem; font-size: 0.82rem; }
      .settings-modal { max-height: calc(100vh - 2rem); overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>易道</h1>
        <p>选一位大师，与他聊天</p>
      </div>
      <div class="master-list" id="masterList"></div>
    </aside>
    <section class="chat-panel">
      <div class="chat-header" id="chatHeader">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="打开角色列表">☰</button>
        <div class="head-text">
          <div class="name" id="chatTitle">神算子</div>
          <div class="skill" id="chatSkill">男 · 五十开外 · 综合预测 · 易经、八字、六爻、择日皆通，有问必答。</div>
        </div>
        <div class="header-actions">
          <div class="model-status" id="modelStatus">模型：读取中</div>
          <button type="button" class="icon-btn" id="settingsBtn" title="配置 LLM API Key 和模型" aria-label="配置模型">模型</button>
        </div>
      </div>
      <main id="messages"></main>
      <div id="input-area">
    <div id="input-wrap">
      <textarea id="input" rows="2" placeholder="例如：身份证1990年5月1日，农历生日是哪天 / 想给娃取名字 / 结婚选吉日 / 帮我占一卦"></textarea>
      <button id="send" type="button">发送</button>
    </div>
        <p class="hint">支持：公历↔农历、取名、八字、占卦、择日等</p>
      </div>
    </section>
  </div>
  <div class="modal-overlay" id="settingsOverlay" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-head">
        <h2 id="settingsTitle">LLM 设置</h2>
        <button type="button" class="icon-btn" id="settingsClose" aria-label="关闭设置">×</button>
      </div>
      <form class="settings-body" id="settingsForm" autocomplete="off">
        <div class="field">
          <label for="llmBaseUrl">Base URL</label>
          <input id="llmBaseUrl" type="url" autocomplete="off" placeholder="https://api.deepseek.com 或 https://api.openai.com/v1" />
        </div>
        <div class="field">
          <label for="llmApiKey">API Key</label>
          <input id="llmApiKey" type="password" autocomplete="off" placeholder="不填则使用后端 .env" />
        </div>
        <div class="field">
          <label for="llmModel">模型</label>
          <input id="llmModel" type="text" autocomplete="off" placeholder="deepseek-chat / gpt-4.1-mini 等" />
        </div>
        <label class="toggle-row" for="llmRemember">
          <input id="llmRemember" type="checkbox" />
          <span>保存到本机浏览器。勾选后 API Key 会存入 localStorage，只适合个人电脑或本地开发环境。</span>
        </label>
        <p class="settings-note" id="settingsNote">未填写 API Key 时，会继续使用后端环境变量 OPENAI_API_KEY。</p>
        <div class="settings-actions">
          <button type="button" class="secondary-btn" id="settingsClear">清空</button>
          <button type="button" class="secondary-btn" id="settingsCancel">取消</button>
          <button type="submit" class="primary-btn" id="settingsSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const masterListEl = document.getElementById('masterList');
    const chatTitleEl = document.getElementById('chatTitle');
    const chatSkillEl = document.getElementById('chatSkill');
    const sidebarEl = document.getElementById('sidebar');
    const sidebarOverlayEl = document.getElementById('sidebarOverlay');
    const menuBtnEl = document.getElementById('menuBtn');
    const settingsBtnEl = document.getElementById('settingsBtn');
    const settingsOverlayEl = document.getElementById('settingsOverlay');
    const settingsCloseEl = document.getElementById('settingsClose');
    const settingsCancelEl = document.getElementById('settingsCancel');
    const settingsFormEl = document.getElementById('settingsForm');
    const settingsSaveEl = document.getElementById('settingsSave');

    function loadChatHistory() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        if (data.currentMasterId) currentMasterId = data.currentMasterId;
        if (data.messagesByMaster && typeof data.messagesByMaster === 'object') {
          messagesByMaster = data.messagesByMaster;
        }
      } catch (e) {}
    }

    function saveChatHistory() {
      try {
        var toSave = {};
        Object.keys(messagesByMaster).forEach(function(id) {
          var list = messagesByMaster[id];
          if (Array.isArray(list) && list.length > 0) {
            toSave[id] = list.slice(-MAX_MESSAGES_PER_MASTER);
          }
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          currentMasterId: currentMasterId,
          messagesByMaster: toSave
        }));
      } catch (e) {}
    }

    function loadLlmConfig() {
      try {
        var raw = localStorage.getItem(LLM_STORAGE_KEY);
        if (!raw) return;
        var saved = JSON.parse(raw);
        if (saved && typeof saved === 'object') {
          llmConfig = {
            base_url: saved.base_url || '',
            api_key: saved.api_key || '',
            model: saved.model || '',
            remember: !!saved.remember
          };
        }
      } catch (e) {}
    }

    function saveLlmConfig() {
      try {
        if (llmConfig.remember) {
          localStorage.setItem(LLM_STORAGE_KEY, JSON.stringify(llmConfig));
        } else {
          localStorage.removeItem(LLM_STORAGE_KEY);
        }
      } catch (e) {}
    }

      return llmConfig.model || serverLlmDefaults.model || '未设置';
    }

      modelStatusEl.textContent = '模型：' + getEffectiveModelName() + ' · ' + source;
      modelStatusEl.title = modelStatusEl.textContent;

        api_key: (llmApiKeyEl.value || '').trim(),
        model: (llmModelEl.value || '').trim(),
        remember: !!llmRememberEl.checked

      updateModelStatus();

    function clearSettings() {
      llmConfig = { base_url: '', api_key: '', model: '', remember: false };
      try { localStorage.removeItem(LLM_STORAGE_KEY); } catch (e) {}

      if (llmApiKeyEl) llmApiKeyEl.value = '';

    function getLlmPayload() {
      var payload = {};
      if (llmConfig.base_url) payload.base_url = llmConfig.base_url;
      if (llmConfig.api_key) payload.api_key = llmConfig.api_key;
      if (llmConfig.model) payload.model = llmConfig.model;
      return Object.keys(payload).length ? payload : undefined;

    function getCurrentMaster() {
      const m = MASTER_MAP[currentMasterId];
      return m ? { id: currentMasterId, ...m } : { id: 'shengsuanzi', name: '神算子', avatar: '神', gender: '男', age: '五十开外', skill: '综合预测', intro: '易经、八字、六爻、择日皆通，有问必答。' };
    }

    function hashString(s) {
      var hash = 0;
      for (var i = 0; i < s.length; i++) {
        hash = ((hash << 5) - hash) + s.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getMasterStyle(id, master) {
      var text = [master.skill || '', master.intro || '', master.name || ''].join(' ');
      for (var i = 0; i < SKILL_STYLES.length; i++) {
        if (SKILL_STYLES[i].match.test(text)) return SKILL_STYLES[i];
      }
      return FALLBACK_STYLES[hashString(id) % FALLBACK_STYLES.length];
    }

          var meta = (m.gender && m.age) ? (m.gender + ' · ' + m.age) : '';

          item.innerHTML = '<div class="avatar" data-mark="' + style.mark + '">' + avatarHtml + '</div><div class="info"><div class="name">' + (m.name || id) + '</div>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '<div class="skill">' + (m.skill || '') + '</div></div>';
          item.addEventListener('click', function() { switchMaster(id); });
          masterListEl.appendChild(item);

      const m = getCurrentMaster();

    function switchMaster(id) {
      if (id === currentMasterId) return;
      currentMasterId = id;
      saveChatHistory();
      renderSidebar();
      updateChatHeader();
      if (isMobile()) closeSidebar();
      messagesEl.innerHTML = '';
      const m = MASTER_MAP[id];

      list.forEach(function(msg) {
        addMessage(msg.role, msg.content, msg.role === 'assistant' ? { masterName: m && m.name, masterAvatar: m && m.avatar, masterId: id } : null);
      });

    function restoreCurrentConversation() {
      messagesEl.innerHTML = '';
      var m = MASTER_MAP[currentMasterId];
      var list = messagesByMaster[currentMasterId] || [];
      list.forEach(function(msg) {
        addMessage(msg.role, msg.content, msg.role === 'assistant' ? { masterName: m && m.name, masterAvatar: m && m.avatar, masterId: currentMasterId } : null);

    function pushMessage(role, content) {
      pushMessageForMaster(currentMasterId, role, content);
    }

    function pushMessageForMaster(masterId, role, content) {
      if (!messagesByMaster[masterId]) messagesByMaster[masterId] = [];
      messagesByMaster[masterId].push({ role: role, content: content });
      saveChatHistory();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function addMessage(role, content, opts) {
      opts = opts || {};
      const row = document.createElement('div');
      row.className = 'msg-row ' + role;
      const nameLabel = role === 'user' ? '我' : (opts.masterName || '神算子');
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (role === 'user') {
        avatar.textContent = '我';
      } else {
        avatar.textContent = opts.masterAvatar || '神';
      }
      const msgBlock = document.createElement('div');
      msgBlock.className = 'msg-block';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = nameLabel;
      const bubble = document.createElement('div');
      bubble.className = 'msg ' + role;
      bubble.innerHTML = escapeHtml(content);
      msgBlock.appendChild(name);
      msgBlock.appendChild(bubble);
      if (role === 'user') {
        row.appendChild(msgBlock);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(msgBlock);
      }
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { row, bubble };
    }

    function addThinkingRow() {
      const m = getCurrentMaster();
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = m.avatar || '神';
      const msgBlock = document.createElement('div');
      msgBlock.className = 'msg-block';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = m.name;
      const bubble = document.createElement('div');
      bubble.className = 'msg thinking';
      bubble.innerHTML = '思考中<span class="think-dots"><span>.</span><span>.</span><span>.</span></span>';
      msgBlock.appendChild(name);
      msgBlock.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(msgBlock);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { row, bubble };
    }

    function ensureMsgBody(bubble) {
      let body = bubble.querySelector('.msg-body');
      if (!body) {
        body = document.createElement('span');
        body.className = 'msg-body';
        bubble.appendChild(body);
      }
      return body;
    }

    async function send() {
      const text = (inputEl.value || '').trim();
      if (!text) return;
      const requestMasterId = currentMasterId;
      const requestMaster = getCurrentMaster();
      inputEl.value = '';
      addMessage('user', text);
      pushMessageForMaster(requestMasterId, 'user', text);
      sendBtn.disabled = true;

      const list = messagesByMaster[requestMasterId] || [];
      const messages = list.map(function(m) { return { role: m.role, content: m.content }; });

      const { row: thinkRow } = addThinkingRow();
      let fullReply = '';

      try {
        const payload = { messages: messages, master: requestMasterId };
        const llmPayload = getLlmPayload();
        if (llmPayload) payload.llm = llmPayload;
        const res = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok || !res.body) {
          thinkRow.remove();
          const errMsg = '请求失败：' + (res.status || '网络错误');
          if (currentMasterId === requestMasterId) {
            addMessage('assistant', errMsg, { masterName: requestMaster.name, masterAvatar: requestMaster.avatar, masterId: requestMasterId });
          }
          pushMessageForMaster(requestMasterId, 'assistant', errMsg);
          sendBtn.disabled = false;
          return;
        }
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buffer = '';
        let firstChunk = true;
        let assistantBubble = null;
        let textBuffer = '';
        let typewriterTimer = null;

        function flushTypewriter() {
          if (!assistantBubble || !textBuffer.length) return;
          const body = ensureMsgBody(assistantBubble);
          const ch = textBuffer[0];
          textBuffer = textBuffer.slice(1);
          body.appendChild(document.createTextNode(ch));
          messagesEl.scrollTop = messagesEl.scrollHeight;
          typewriterTimer = setTimeout(flushTypewriter, TYPING_DELAY);
        }

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += dec.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.done && data.content === undefined) break;
                if (firstChunk && data.content) {
                  firstChunk = false;
                  thinkRow.remove();
                  if (currentMasterId === requestMasterId) {
                    const r = addMessage('assistant', '', { masterName: requestMaster.name, masterAvatar: requestMaster.avatar, masterId: requestMasterId });
                    assistantBubble = r.bubble;
                  }
                }
                if (data.content) {
                  fullReply += data.content;
                  if (assistantBubble) {
                    textBuffer += data.content;
                    if (!typewriterTimer) typewriterTimer = setTimeout(flushTypewriter, TYPING_DELAY);
                  }
                }
              } catch (_) {}
            }
          }
        }
        if (typewriterTimer) clearTimeout(typewriterTimer);
        while (textBuffer && assistantBubble) {
          const body = ensureMsgBody(assistantBubble);
          body.appendChild(document.createTextNode(textBuffer));
          textBuffer = '';
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        if (firstChunk) {
          thinkRow.remove();
          fullReply = '（暂无回复）';
          if (currentMasterId === requestMasterId) {
            addMessage('assistant', fullReply, { masterName: requestMaster.name, masterAvatar: requestMaster.avatar, masterId: requestMasterId });
          }
        }
        pushMessageForMaster(requestMasterId, 'assistant', fullReply);
      } catch (e) {
        thinkRow.remove();
        const errMsg = '请求失败：' + (e.message || '网络错误');
        if (currentMasterId === requestMasterId) {
          addMessage('assistant', errMsg, { masterName: requestMaster.name, masterAvatar: requestMaster.avatar, masterId: requestMasterId });
        }
        pushMessageForMaster(requestMasterId, 'assistant', errMsg);
      }
      sendBtn.disabled = false;
    }

    function initMasters() {
      fetch('/api/masters')
        .then(function(r) { return r.json(); })
        .then(function(masters) {
          if (Array.isArray(masters)) {
            masters.forEach(function(m) {
              if (MASTER_MAP[m.id]) {
                if (m.intro) MASTER_MAP[m.id].intro = m.intro;
                if (m.gender) MASTER_MAP[m.id].gender = m.gender;
                if (m.age) MASTER_MAP[m.id].age = m.age;
                if (m.avatar_url) MASTER_MAP[m.id].avatar_url = m.avatar_url;
              }
            });
          }
          renderSidebar();
          updateChatHeader();
        })
        .catch(function() { updateChatHeader(); });
    }

    function initLlmDefaults() {
      updateModelStatus();
      fetch('/api/llm/defaults')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          serverLlmDefaults = {
            base_url: data.base_url || '',
            model: data.model || 'deepseek-chat',
            has_api_key: !!data.has_api_key
          };
          updateModelStatus();
        })
        .catch(function() { updateModelStatus(); });
    }

    loadChatHistory();
    loadLlmConfig();
    renderSidebar();
    updateChatHeader();
    restoreCurrentConversation();
    initMasters();
    initLlmDefaults();

    if (menuBtnEl) menuBtnEl.addEventListener('click', toggleSidebar);
    if (sidebarOverlayEl) sidebarOverlayEl.addEventListener('click', closeSidebar);
    if (settingsBtnEl) settingsBtnEl.addEventListener('click', openSettings);
    if (settingsCloseEl) settingsCloseEl.addEventListener('click', closeSettings);
    if (settingsCancelEl) settingsCancelEl.addEventListener('click', closeSettings);
    if (settingsFormEl) {
      settingsFormEl.addEventListener('submit', function(e) {
        e.preventDefault();
        persistSettingsFromForm();
      });
    }
    if (settingsClearEl) settingsClearEl.addEventListener('click', clearSettings);
    if (settingsOverlayEl) {
      settingsOverlayEl.addEventListener('click', function(e) {
        if (e.target === settingsOverlayEl) closeSettings();
      });
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeSettings();
        if (isMobile()) closeSidebar();
      }
    });

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
